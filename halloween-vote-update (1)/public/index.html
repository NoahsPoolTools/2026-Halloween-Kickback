<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0f26">
<title>Voting · Noah’s Halloween Kickback</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Creepster&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .host-link {
    position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px;
    width: 40px; height: 40px; display: grid; place-items: center;
    font-size: 20px; text-decoration: none; border-radius: 50%;
    opacity: 0.22; z-index: 10;
  }
  .host-link:hover, .host-link:focus-visible { opacity: 1; }
  .namebox { display: grid; gap: 6px; margin: 0 0 16px; }
  .namebox span { font-weight: 700; }
  .namebox input {
    background: var(--night); border: 2px solid var(--crypt-2); border-radius: 12px;
    padding: 14px; width: 100%; font-size: 1.15rem;
  }
  .namebox input:focus { border-color: var(--blood); outline: none; }
  .count { text-align: center; font-weight: 800; font-size: 1.05rem; }
  .count .k { color: var(--blood); }
</style>
</head>
<body>
<a class="host-link" href="/admin.html" aria-label="Host controls">🦇</a>
<div class="wrap">
  <a class="home-link" href="/">
    <h1 class="title">Noah’s 2026 Halloween Party Kickback</h1>
    <p class="subtitle">Costume voting &amp; murder mystery</p>
  </a>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"><div class="panel"><p>Loading the ballot…</p></div></main>
</div>
<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <div class="slots" id="slots"></div>
    <div class="count" id="count" hidden></div>
    <button class="btn block" id="submit" disabled>Cast my vote</button>
  </div>
</div>

<script>
(() => {
  const RANK_CLASS = ["r1", "r2", "r3"];
  const ORD = ["1st", "2nd", "3rd"];
  const HOWTO = {
    best: "Tap your <b>favorite</b> costume first, then your 2nd and 3rd.",
    couple: "Tap your <b>favorite</b> couple first, then your 2nd and 3rd.",
    worst: "Tap the <b>worst</b> costume first, then the 2nd and 3rd worst.",
  };

  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let voterId = ls.get("hv26-voter", null);
  if (!voterId) {
    voterId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^a-zA-Z0-9-]/g, "");
    ls.set("hv26-voter", voterId);
  }
  const myVotes = ls.get("hv26-votes", {});   // cat -> [ids] submitted
  let guessName = ls.get("hv26-name", "");
  const picks = {};                            // cat -> in-progress picks
  const editing = {};
  let state = null, lastStateJson = "";
  let current = ls.get("hv26-cat", "best");
  let sending = false;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function toast(msg, ok) {
    const t = document.createElement("div");
    t.className = "toast" + (ok ? " ok" : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  const catInfo = (id) => state.categories.find((c) => c.id === id);
  const entrantsFor = (cat) => (state ? state.entrants.filter((e) => e.category === cat) : []);
  const needed = (cat) => Math.min(catInfo(cat).pick, entrantsFor(cat).length);
  const nameOf = (id) => (state.entrants.find((e) => e.id === id) || {}).name || "Removed";
  const isGuess = (cat) => catInfo(cat).kind === "guess";

  async function load() {
    // don't redraw while someone is typing their name
    if (document.activeElement && document.activeElement.id === "guessName") return;
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error();
      const text = await r.text();
      if (text === lastStateJson) return;
      lastStateJson = text;
      state = JSON.parse(text);
      for (const c of state.categories) {
        const ids = new Set(entrantsFor(c.id).map((e) => e.id));
        picks[c.id] = (picks[c.id] || []).filter((id) => ids.has(id));
      }
      if (!state.categories.some((c) => c.id === current)) current = state.categories[0].id;
      render();
    } catch {
      if (!state) $("main").innerHTML = `<div class="panel"><h2>Can’t reach the ballot</h2><p>Check your Wi-Fi or signal, then tap below.</p><button class="btn" onclick="location.reload()">Reload</button></div>`;
    }
  }

  function renderTabs() {
    const tabs = $("tabs");
    tabs.classList.toggle("four", state.categories.length === 4);
    tabs.innerHTML = state.categories.map((c) => `
      <button class="tab" role="tab" aria-selected="${c.id === current}" data-cat="${c.id}">
        ${myVotes[c.id] ? `<span class="done">${c.kind === "guess" ? "In" : "Voted"}</span>` : ""}
        <span class="emo" aria-hidden="true">${c.emoji}</span>${esc(c.name)}
      </button>`).join("");
  }

  function cardHtml(e, cat) {
    const p = picks[cat];
    const r = p.indexOf(e.id);
    const guess = isGuess(cat);
    const rc = r < 0 ? "" : guess ? " rk" : " " + RANK_CLASS[r];
    const img = e.photo
      ? `<img class="pic" src="${esc(e.photo)}" alt="" loading="lazy">`
      : `<div class="nopic" aria-hidden="true">${esc(e.name.trim().charAt(0).toUpperCase() || "?")}</div>`;
    const badge = r < 0 ? "" : `<span class="badge${rc}">${guess ? "🔪" : r + 1}</span>`;
    const label = r < 0 ? "" : guess ? ", picked as a murderer" : `, your ${ORD[r]} pick`;
    return `<button class="card${rc}" data-id="${esc(e.id)}" aria-pressed="${r >= 0}" aria-label="${esc(e.name)}${label}">
      ${img}${badge}<div class="name">${esc(e.name)}</div></button>`;
  }

  function render() {
    if (!state) return;
    renderTabs();
    const cat = current;
    const info = catInfo(cat);
    const guess = info.kind === "guess";
    const list = entrantsFor(cat);
    const open = state.status[cat] === "open";
    const voted = myVotes[cat];
    const main = $("main");
    let showBar = false;

    if (!open) {
      main.innerHTML = guess
        ? `<div class="panel"><div class="big">🔪</div><h2>${voted ? "Guessing is closed" : "Not open yet"}</h2>
            <p>${voted ? "Your guesses are locked in. The murderers get revealed soon." : "Guessing opens at the end of the night. Keep your eyes open until then."}</p>${nextButton(cat)}</div>`
        : `<div class="panel"><div class="big">🔒</div><h2>Voting is closed</h2>
            <p>${voted ? "Your vote was counted." : "This one’s locked in."} Winners get announced soon.</p>${nextButton(cat)}</div>`;
    } else if (list.length === 0) {
      main.innerHTML = `<div class="panel"><div class="big">👻</div><h2>No one’s in yet</h2>
        <p>${guess ? "Suspects show up here once Noah adds them." : "Entrants show up here as people arrive."} This page updates on its own.</p></div>`;
    } else if (voted && !editing[cat]) {
      main.innerHTML = `<div class="panel"><div class="big">${info.emoji}</div>
        <h2>${guess ? `Your guesses are in${guessName ? ", " + esc(guessName) : ""}` : "Your vote is in"}</h2>
        <ul class="mypicks">${voted.map((id, i) => `<li><span class="dot" style="background:${guess ? "var(--blood)" : `var(--${RANK_CLASS[i]})`}">${guess ? "🔪" : i + 1}</span>${esc(nameOf(id))}</li>`).join("")}</ul>
        <div class="stack">${nextButton(cat)}<button class="btn ghost" data-act="edit">Change my ${guess ? "guesses" : "picks"}</button></div></div>`;
    } else {
      showBar = true;
      const p = picks[cat];
      const need = needed(cat);
      let howto;
      if (guess) {
        howto = need === info.pick
          ? `Tap the <b>${need} people</b> you think are the murderers. Order doesn’t matter.`
          : `Tap the <b>${need}</b> ${need === 1 ? "person" : "people"} you suspect.`;
      } else {
        howto = need === 3 ? HOWTO[cat] : `Only ${list.length} so far. Tap ${need === 1 ? "your pick" : "them in order"}.`;
      }
      main.innerHTML = `
        ${guess ? `<label class="namebox"><span>Your name (so Noah knows who solved it)</span>
          <input id="guessName" type="text" autocomplete="name" autocapitalize="words" maxlength="40" placeholder="First and last" value="${esc(guessName)}"></label>` : ""}
        <p class="howto">${howto} Tap again to undo.</p>
        <div class="grid">${list.map((e) => cardHtml(e, cat)).join("")}</div>
        ${voted ? `<p style="margin-top:16px"><button class="btn ghost small" data-act="cancel">Keep my old ${guess ? "guesses" : "vote"}</button></p>` : ""}`;

      const ready = p.length === need;
      if (guess) {
        $("slots").hidden = true;
        $("count").hidden = false;
        $("count").innerHTML = `<span class="k">🔪</span> ${p.length} of ${need} picked`;
        const hasName = guessName.trim().length > 0;
        $("submit").disabled = !ready || !hasName || sending;
        $("submit").textContent = sending ? "Sending…" : !ready ? `Pick ${need - p.length} more` : !hasName ? "Type your name above" : "Lock in my guesses";
      } else {
        $("slots").hidden = false;
        $("count").hidden = true;
        $("slots").innerHTML = [0, 1, 2].slice(0, need).map((i) => {
          const id = p[i];
          return `<div class="slot${id ? " filled " + RANK_CLASS[i] : ""}"><b>${i + 1}</b>${id ? esc(nameOf(id)) : "—"}</div>`;
        }).join("");
        $("slots").style.gridTemplateColumns = `repeat(${need}, 1fr)`;
        $("submit").disabled = !ready || sending;
        $("submit").textContent = sending ? "Sending…" : ready ? "Cast my vote" : `Pick ${need - p.length} more`;
      }
    }
    $("bar").hidden = !showBar;
  }

  function nextButton(cat) {
    const next = state.categories.find((c) => c.id !== cat && !myVotes[c.id] && state.status[c.id] === "open" && entrantsFor(c.id).length);
    if (!next) return "";
    return `<button class="btn" data-next="${next.id}">${next.kind === "guess" ? "Guess the murderers" : "Vote " + esc(next.name)} ${next.emoji}</button>`;
  }

  function go(cat) { current = cat; ls.set("hv26-cat", current); window.scrollTo(0, 0); render(); }

  document.addEventListener("input", (ev) => {
    if (ev.target.id !== "guessName") return;
    guessName = ev.target.value;
    ls.set("hv26-name", guessName);
    // update just the button so the keyboard stays up
    const need = needed(current), ready = picks[current].length === need, hasName = guessName.trim().length > 0;
    $("submit").disabled = !ready || !hasName || sending;
    $("submit").textContent = !ready ? `Pick ${need - picks[current].length} more` : !hasName ? "Type your name above" : "Lock in my guesses";
  });

  document.addEventListener("click", (ev) => {
    const tab = ev.target.closest(".tab"); if (tab) return go(tab.dataset.cat);
    const nx = ev.target.closest("[data-next]"); if (nx) return go(nx.dataset.next);
    const act = ev.target.closest("[data-act]");
    if (act) {
      if (act.dataset.act === "edit") { editing[current] = true; picks[current] = isGuess(current) ? myVotes[current].slice() : []; }
      if (act.dataset.act === "cancel") editing[current] = false;
      return render();
    }
    const card = ev.target.closest(".card");
    if (card) {
      const p = picks[current];
      const id = card.dataset.id;
      const at = p.indexOf(id);
      if (at >= 0) p.splice(at, 1);
      else if (p.length < needed(current)) p.push(id);
      else { toast(`You’ve picked ${needed(current)}. Tap one to undo it first.`); return; }
      if (navigator.vibrate) navigator.vibrate(15);
      render();
    }
  });

  $("submit").addEventListener("click", async () => {
    const cat = current;
    const p = picks[cat].slice();
    const guess = isGuess(cat);
    if (p.length !== needed(cat) || sending) return;
    if (guess && !guessName.trim()) return;
    sending = true; render();
    try {
      const r = await fetch("/api/vote", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ voterId, category: cat, picks: p, name: guess ? guessName.trim() : undefined }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || "That didn’t go through. Try again.");
      myVotes[cat] = p; ls.set("hv26-votes", myVotes);
      editing[cat] = false; picks[cat] = [];
      toast(guess ? "Guesses locked in!" : "Vote counted!", true);
      window.scrollTo(0, 0);
    } catch (e) {
      toast(e.message || "That didn’t go through. Try again.");
      lastStateJson = ""; load();
    } finally {
      sending = false; render();
    }
  });

  load();
  setInterval(() => { if (!document.hidden) load(); }, 12000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
